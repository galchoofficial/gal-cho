name: Scheduled rebuild (予約投稿用・保険)

# 【メインは Cloudflare Workers Cron Trigger】
# 予約投稿のリビルドは Cloudflare Workers Cron（JST 7:00/11:00/17:00）が本番稼働中。
# この GitHub Actions は「Workers が万一止まった時の保険」として 1日1回だけ走る。
#
# 以前は 15 個の cron を仕込んでいたが、複数 cron が同時発火して
# git push が競合（non-fast-forward）→ 失敗通知メールが多発したため、
# 1日1回（記事公開時刻とずらした深夜）に削減した。
on:
  schedule:
    # JST 0:30（記事公開時刻 7/11/17 と被らない深夜帯。競合・空振り回避）
    - cron: '30 15 * * *'
  # 手動実行も可能（緊急リビルド用）
  workflow_dispatch:

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit to trigger Cloudflare Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 競合回避: push 直前に最新を取り込む（複数 run 同時発火対策）
          git pull --rebase origin main || true
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TIME_JST=$(TZ=Asia/Tokyo date +%H:%M)
          git commit --allow-empty -m "chore: scheduled rebuild for ${DATE_JST} ${TIME_JST} JST"
          # push が競合したら一度だけ pull --rebase してリトライ
          git push || (git pull --rebase origin main && git push)
