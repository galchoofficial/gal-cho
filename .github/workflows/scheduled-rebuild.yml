name: Scheduled rebuild (予約投稿用)

# Hugo の publishDate が未来の記事を、その日が来たら公開するために
# 毎日 JST 9:00 に空コミットを push して Cloudflare Pages に再ビルドを促す。
on:
  schedule:
    # GitHub Actions の cron は UTC。JST 9:00 = UTC 0:00
    - cron: '0 0 * * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit to trigger Cloudflare Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git commit --allow-empty -m "chore: scheduled rebuild for ${DATE_JST}"
          git push
