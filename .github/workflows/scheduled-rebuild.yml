name: Scheduled rebuild (予約投稿用)

# Hugo の publishDate が未来の記事を、その日が来たら公開するために
# 予約時刻の少し前に空コミットを push して Cloudflare Pages に再ビルドを促す。
#
# 記事の予約時刻：JST 7:00 / 11:00 / 17:00（朝・昼・夕の3枠運用）
# GitHub Actions の cron はしばしば数時間遅延するため、
# 「予約時刻の10分前」＋「予約時刻ピッタリ」の2段構えで保険をかける。
on:
  schedule:
    # ===== JST 7:00 予約用（5段構え保険）=====
    - cron: '40 21 * * *'  # JST 6:40
    - cron: '50 21 * * *'  # JST 6:50
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '15 22 * * *'  # JST 7:15
    - cron: '30 22 * * *'  # JST 7:30
    # ===== JST 11:00 予約用（5段構え保険）=====
    - cron: '40 1 * * *'   # JST 10:40
    - cron: '50 1 * * *'   # JST 10:50
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '15 2 * * *'   # JST 11:15
    - cron: '30 2 * * *'   # JST 11:30
    # ===== JST 17:00 予約用（5段構え保険）=====
    - cron: '40 7 * * *'   # JST 16:40
    - cron: '50 7 * * *'   # JST 16:50
    - cron: '0 8 * * *'    # JST 17:00
    - cron: '15 8 * * *'   # JST 17:15
    - cron: '30 8 * * *'   # JST 17:30
  # 手動実行も可能
  workflow_dispatch:

# 同じスケジュール枠で複数走らないように直近の実行をキャンセル
concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit to trigger Cloudflare Pages rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TIME_JST=$(TZ=Asia/Tokyo date +%H:%M)
          # 直近のリビルドが10分以内なら skip（同時刻にcron 2本走ったときの保険）
          LAST_COMMIT_MSG=$(git log -1 --pretty=%s)
          LAST_COMMIT_TIME=$(git log -1 --pretty=%ct)
          NOW=$(date +%s)
          DIFF=$((NOW - LAST_COMMIT_TIME))
          if [[ "$LAST_COMMIT_MSG" == chore:\ scheduled\ rebuild\ for\ * ]] && [ "$DIFF" -lt 600 ]; then
            echo "Last rebuild was $DIFF seconds ago (<10min), skipping to avoid duplicate."
            exit 0
          fi
          git commit --allow-empty -m "chore: scheduled rebuild for ${DATE_JST} ${TIME_JST} JST"
          git push
