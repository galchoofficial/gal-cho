{{ define "main" }}
<!-- Crumb -->
<div class="wrap-narrow crumb">
  <a href="{{ "/" | relURL }}">ホーム</a>
  <span class="sep">›</span>
  <strong>{{ .Title }}</strong>
</div>

<!-- Page header -->
<section class="wrap-narrow" style="padding: 32px 0 24px;">
  <h1 class="art-title" style="font-size: 36px;">{{ .Title }}</h1>
  {{- with .Params.lead }}
  <p class="art-lead">{{ . | safeHTML }}</p>
  {{- end }}
</section>

<!-- Content -->
<article class="wrap-narrow art-body">
  {{ .Content }}
</article>

<div style="height: 64px;"></div>
{{ end }}
